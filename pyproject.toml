[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imob-ai"
version = "0.1.0"
description = "Solução de engenharia de IA aplicada ao contexto imobiliário."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Julia" }]
dependencies = [
  "numpy==1.26.4",
  "pydantic==2.13.5",
  "sentence-transformers==5.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "model_integration: requer o modelo Sentence Transformers local ou acesso para download",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

