[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imob-ai"
version = "0.1.0"
description = "Solução de engenharia de IA aplicada ao contexto imobiliário."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Julia" }]
dependencies = [
  "fastapi==0.115.13",
  "numpy==1.26.4",
  "pydantic==2.13.5",
  "scikit-learn==1.6.1",
  "sentence-transformers==5.1.2",
  "streamlit==1.50.0",
  "torch==2.2.2",
  "transformers==4.57.6",
  "uvicorn==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.2",
]
hub = [
  "huggingface_hub==0.36.2",
  "PyYAML==6.0.3",
  "skops==0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not transformer_integration and not hub_publication_integration'"
testpaths = ["tests"]
markers = [
  "hub: valida a preparação local dos pacotes para o Hugging Face Hub",
  "hub_publication_integration: acessa os repositórios públicos reais do Hugging Face",
  "model_integration: requer o modelo Sentence Transformers local ou acesso para download",
  "transformer_integration: requer o modelo Hugging Face local ou acesso para download",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

